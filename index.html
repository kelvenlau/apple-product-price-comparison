<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Apple Product Price Comparison</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/build-assets/icon.iconset/icon_512x512.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f8;
        --bg-secondary: #fcfcfe;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: rgba(255, 255, 255, 0.92);
        --surface-muted: rgba(248, 249, 252, 0.76);
        --surface-highlight: rgba(255, 255, 255, 0.96);
        --border: rgba(90, 101, 124, 0.12);
        --border-strong: rgba(90, 101, 124, 0.18);
        --text: #1d1d1f;
        --subtext: #62646c;
        --accent: #0a84ff;
        --accent-strong: #0066cc;
        --accent-soft: rgba(10, 132, 255, 0.12);
        --accent-wash: rgba(97, 181, 255, 0.18);
        --success: #138a52;
        --danger: #c53b32;
        --danger-soft: rgba(197, 59, 50, 0.08);
        --success-soft: rgba(19, 138, 82, 0.09);
        --shadow: 0 26px 70px rgba(39, 51, 71, 0.12);
        --shadow-soft: 0 14px 34px rgba(39, 51, 71, 0.08);
        --inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 18px;
        --radius-sm: 14px;
        font-family:
          "SF Pro Display",
          "SF Pro Text",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Helvetica Neue",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 0% 0%, rgba(76, 152, 255, 0.18), transparent 28%),
          radial-gradient(circle at 100% 6%, rgba(255, 214, 153, 0.18), transparent 20%),
          radial-gradient(circle at 20% 100%, rgba(173, 216, 255, 0.16), transparent 24%),
          linear-gradient(180deg, #fbfbfe 0%, #f0f2f7 52%, #eceff5 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        position: relative;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        border-radius: 999px;
        pointer-events: none;
        filter: blur(36px);
        opacity: 0.9;
      }

      body::before {
        top: 104px;
        left: -80px;
        width: 220px;
        height: 220px;
        background: rgba(95, 170, 255, 0.13);
      }

      body::after {
        right: -56px;
        bottom: 140px;
        width: 200px;
        height: 200px;
        background: rgba(255, 201, 145, 0.12);
      }

      .app-shell {
        width: min(100%, 430px);
        position: relative;
      }

      .hero {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 20px 0 16px;
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 249, 252, 0.9));
        border: 1px solid var(--border);
        box-shadow: var(--shadow-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: clamp(32px, 7vw, 42px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 0;
        color: var(--subtext);
        font-size: 15px;
        line-height: 1.5;
        max-width: 28ch;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .panel {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(247, 249, 252, 0.74));
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow), var(--inner-glow);
      }

      .controls {
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 13px;
        color: var(--subtext);
        font-weight: 600;
      }

      .field select,
      .refresh-button,
      .source-link {
        -webkit-appearance: none;
        appearance: none;
        border: 0;
        outline: 0;
        font: inherit;
      }

      .field select {
        width: 100%;
        padding: 16px 18px;
        border-radius: var(--radius-md);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 249, 252, 0.9));
        color: var(--text);
        border: 1px solid var(--border-strong);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.86),
          0 1px 2px rgba(39, 51, 71, 0.04);
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .field select:focus {
        border-color: rgba(10, 132, 255, 0.34);
        box-shadow:
          0 0 0 4px rgba(10, 132, 255, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .controls-row {
        display: flex;
        gap: 10px;
      }

      .refresh-button {
        flex: 1;
        padding: 14px 18px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, #2d3138 0%, #17191d 100%);
        color: white;
        font-weight: 600;
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 12px 24px rgba(23, 25, 29, 0.18);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          opacity 180ms ease;
      }

      .refresh-button:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 16px 28px rgba(23, 25, 29, 0.22);
      }

      .refresh-button:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      .summary {
        padding: 20px;
        display: grid;
        gap: 18px;
      }

      .summary-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .summary-kicker {
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
      }

      .summary-title {
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .summary-note {
        margin: 6px 0 0;
        color: var(--subtext);
        font-size: 14px;
        line-height: 1.5;
      }

      .price-card {
        padding: 18px;
        border-radius: var(--radius-lg);
        background:
          radial-gradient(circle at top left, rgba(120, 190, 255, 0.26), transparent 42%),
          linear-gradient(135deg, rgba(10, 132, 255, 0.08), rgba(255, 255, 255, 0.86)),
          var(--surface-strong);
        border: 1px solid rgba(10, 132, 255, 0.16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }

      .price-card strong {
        display: block;
        font-size: 40px;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .price-card span {
        display: block;
        margin-top: 8px;
        color: var(--subtext);
        font-size: 14px;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .meta-item {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(245, 247, 251, 0.74));
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }

      .meta-item small {
        display: block;
        color: var(--subtext);
        font-size: 12px;
      }

      .meta-item strong {
        display: block;
        margin-top: 6px;
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .region-list {
        display: grid;
        gap: 12px;
      }

      .region-card {
        padding: 16px;
        display: grid;
        gap: 10px;
        border-radius: var(--radius-lg);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(247, 249, 252, 0.76));
        border: 1px solid var(--border);
        box-shadow: var(--shadow-soft);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.86);
      }

      .region-card.is-default {
        border-color: rgba(10, 132, 255, 0.24);
        background:
          radial-gradient(circle at top left, rgba(130, 197, 255, 0.2), transparent 36%),
          linear-gradient(135deg, rgba(10, 132, 255, 0.08), rgba(255, 255, 255, 0.82)),
          var(--surface);
      }

      .region-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .region-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(224, 239, 255, 0.96), rgba(209, 231, 255, 0.86));
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        border: 1px solid rgba(10, 132, 255, 0.1);
      }

      .region-name {
        font-weight: 700;
      }

      .region-price {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .region-cny {
        font-size: 14px;
        font-weight: 700;
      }

      .region-cny.is-expensive {
        color: var(--danger);
      }

      .region-cny.is-cheaper {
        color: var(--success);
      }

      .region-cny.is-neutral {
        color: var(--subtext);
      }

      .delta-pill {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .delta-pill.is-expensive {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .delta-pill.is-cheaper {
        color: var(--success);
        background: var(--success-soft);
      }

      .delta-pill.is-neutral {
        color: var(--subtext);
        background: rgba(110, 110, 115, 0.1);
      }

      .region-meta,
      .status-row {
        color: var(--subtext);
        font-size: 13px;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 14px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(246, 248, 252, 0.92));
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }

      .source-link:hover {
        transform: translateY(-1px);
        border-color: rgba(10, 132, 255, 0.2);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(238, 245, 255, 0.94));
      }

      .status-row {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(246, 248, 252, 0.8));
        border: 1px dashed var(--border-strong);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }

      .status-row.is-error {
        color: var(--danger);
        border-style: solid;
        background: rgba(201, 52, 47, 0.06);
      }

      .footer-note {
        padding: 0 4px 8px;
        color: var(--subtext);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      @media (min-width: 768px) {
        body {
          padding: 24px;
        }

        .app-shell {
          width: min(100%, 920px);
        }

        .stack {
          grid-template-columns: 320px 1fr;
          align-items: start;
        }

        .hero {
          padding-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div class="eyebrow">Apple 官方价 · 实时抓取</div>
        <h1>Apple Product Price Comparison</h1>
        <p>
          先看中国官网价格，再同步对照其他国家与地区的 Apple 官方售价。
        </p>
      </section>

      <section class="stack">
        <div class="panel controls">
          <div class="field">
            <label for="categorySelect">产品品类</label>
            <select id="categorySelect"></select>
          </div>
          <div class="field">
            <label for="productSelect">产品</label>
            <select id="productSelect"></select>
          </div>
          <div class="field">
            <label for="variantSelect" id="variantLabel">容量 / 配置</label>
            <select id="variantSelect"></select>
          </div>
          <div class="controls-row">
            <button class="refresh-button" id="refreshButton" type="button">刷新官网价格</button>
          </div>
          <div class="status-row" id="statusMessage">正在连接 Apple 官方购买页…</div>
        </div>

        <div class="stack">
          <section class="panel summary">
            <div class="summary-head">
              <div>
                <div class="summary-kicker">默认展示</div>
                <div class="summary-title" id="summaryTitle">中国大陆官网</div>
                <p class="summary-note" id="summaryNote">
                  选择品类、产品和容量后，这里会优先显示中国官网对应价格。
                </p>
              </div>
              <span class="badge" id="liveBadge">实时</span>
            </div>

            <div class="price-card">
              <strong id="chinaPrice">--</strong>
              <span id="chinaMeta">等待价格数据</span>
            </div>

            <div class="meta-grid">
              <div class="meta-item">
                <small>当前产品</small>
                <strong id="selectedProductMeta">--</strong>
              </div>
              <div class="meta-item">
                <small id="selectedVariantMetaLabel">当前容量 / 配置</small>
                <strong id="selectedVariantMeta">--</strong>
              </div>
            </div>
          </section>

          <section class="region-list" id="regionList"></section>
        </div>
      </section>

      <p class="footer-note">
        数据来源为 Apple 官方购买页内嵌价格数据。不同地区税费、销售政策和可售机型可能不同，请以下方官网链接为准。
      </p>
      <p class="footer-note">©️ 2026 R577</p>
    </main>

    <script>
      const appClient =
        window.applePricingApp ||
        {
          async getBootstrap() {
            const response = await fetch("/api/bootstrap");
            if (!response.ok) {
              throw new Error(`bootstrap 接口返回 ${response.status}`);
            }

            return response.json();
          },
          async fetchSnapshot(productId) {
            const response = await fetch(`/api/snapshot?productId=${encodeURIComponent(productId)}`);
            const payload = await response.json().catch(() => ({}));

            if (!response.ok) {
              throw new Error(payload?.error || `snapshot 接口返回 ${response.status}`);
            }

            return payload;
          },
          async openExternal(url) {
            window.open(url, "_blank", "noopener,noreferrer");
          },
        };

      const state = {
        bootstrap: null,
        snapshot: null,
        selectedCategoryId: null,
        selectedProductId: null,
        selectedVariant: null,
      };

      const categorySelect = document.querySelector("#categorySelect");
      const productSelect = document.querySelector("#productSelect");
      const variantSelect = document.querySelector("#variantSelect");
      const variantLabel = document.querySelector("#variantLabel");
      const refreshButton = document.querySelector("#refreshButton");
      const statusMessage = document.querySelector("#statusMessage");
      const summaryTitle = document.querySelector("#summaryTitle");
      const summaryNote = document.querySelector("#summaryNote");
      const chinaPrice = document.querySelector("#chinaPrice");
      const chinaMeta = document.querySelector("#chinaMeta");
      const selectedProductMeta = document.querySelector("#selectedProductMeta");
      const selectedVariantMetaLabel = document.querySelector("#selectedVariantMetaLabel");
      const selectedVariantMeta = document.querySelector("#selectedVariantMeta");
      const regionList = document.querySelector("#regionList");
      const liveBadge = document.querySelector("#liveBadge");

      function setLoading(isLoading) {
        refreshButton.disabled = isLoading;
        refreshButton.textContent = isLoading ? "正在刷新…" : "刷新官网价格";
        liveBadge.textContent = isLoading ? "更新中" : "实时";
      }

      function setStatus(message, type = "default") {
        statusMessage.textContent = message;
        statusMessage.className = `status-row${type === "error" ? " is-error" : ""}`;
      }

      function formatMoney(amount, currencyCode, locale) {
        if (typeof amount !== "number") {
          return "--";
        }

        return new Intl.NumberFormat(locale || "zh-CN", {
          style: "currency",
          currency: currencyCode,
          maximumFractionDigits: currencyCode === "JPY" ? 0 : 2,
        }).format(amount);
      }

      function formatTime(isoString) {
        if (!isoString) {
          return "--";
        }

        return new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(new Date(isoString));
      }

      function getProductsForSelectedCategory() {
        return state.bootstrap.products.filter(
          (product) => product.categoryId === state.selectedCategoryId,
        );
      }

      function getSelectedProduct() {
        return state.bootstrap.products.find((product) => product.id === state.selectedProductId);
      }

      function updateVariantLabel() {
        const selectedProduct = getSelectedProduct();
        const labelText = selectedProduct?.variantKind === "fixed" ? "基础配置" : "容量 / 配置";
        variantLabel.textContent = labelText;
        selectedVariantMetaLabel.textContent = `当前${labelText}`;
      }

      function buildCategoryOptions() {
        categorySelect.innerHTML = state.bootstrap.categories
          .map((category) => `<option value="${category.id}">${category.label}</option>`)
          .join("");
        categorySelect.value = state.selectedCategoryId;
      }

      function buildProductOptions() {
        const products = getProductsForSelectedCategory();

        productSelect.innerHTML = products
          .map(
            (product) =>
              `<option value="${product.id}">${product.label}</option>`,
          )
          .join("");

        if (!products.some((product) => product.id === state.selectedProductId)) {
          state.selectedProductId = products[0]?.id || null;
        }

        productSelect.value = state.selectedProductId;
        updateVariantLabel();
      }

      function buildVariantOptions() {
        const variants = state.snapshot?.variants || [];
        const selectedProduct = getSelectedProduct();
        const fallbackVariant = selectedProduct?.fixedVariantLabel || "";

        variantSelect.innerHTML = variants.length
          ? variants
              .map(
                (variant) =>
                  `<option value="${variant}">${variant}</option>`,
              )
              .join("")
          : `<option value="">暂无可用配置</option>`;

        const preferred =
          variants.includes(state.selectedVariant) && state.selectedVariant
            ? state.selectedVariant
            : state.snapshot?.recommendedVariant || variants[0] || fallbackVariant;

        state.selectedVariant = preferred;
        variantSelect.value = preferred;
        variantSelect.disabled = !variants.length || selectedProduct?.variantKind === "fixed";
      }

      function getRegionPrice(region) {
        const amount = region?.pricesByVariant?.[state.selectedVariant];
        if (typeof amount !== "number") {
          return null;
        }

        const regionMeta = state.bootstrap.regions.find((item) => item.id === region.id);
        return formatMoney(amount, region.currencyCode, regionMeta?.locale || "en");
      }

      function renderSummary() {
        const selectedProduct = getSelectedProduct();
        const chinaRegion = state.snapshot.regions.find((region) => region.id === "cn");
        const chinaRegionMeta = state.bootstrap.regions.find((region) => region.id === "cn");
        const chinaAmount = chinaRegion?.pricesByVariant?.[state.selectedVariant];

        summaryTitle.textContent = "中国大陆官网";
        summaryNote.textContent = chinaRegion?.ok
          ? "价格来自 Apple 中国大陆官方购买页。下方卡片已去掉中国和俄罗斯，改为对照其他国家与地区。"
          : `当前未能读取中国官网价格${chinaRegion?.error ? `：${chinaRegion.error}` : ""}`;

        chinaPrice.textContent =
          typeof chinaAmount === "number"
            ? formatMoney(chinaAmount, chinaRegion.currencyCode, chinaRegionMeta.locale)
            : "--";
        chinaMeta.textContent =
          chinaRegion?.ok && typeof chinaAmount === "number"
            ? `最近刷新 ${formatTime(chinaRegion.fetchedAt)} · 汇率基准 ${state.snapshot.exchangeRates?.base || "CNY"}`
            : "当前配置暂无价格";
        selectedProductMeta.textContent = selectedProduct?.label || "--";
        selectedVariantMeta.textContent = state.selectedVariant || "--";
      }

      function formatCnyPrice(amount) {
        return formatMoney(amount, "CNY", "zh-CN");
      }

      function getRegionComparison(region, chinaCnyAmount) {
        const cnyAmount = region?.pricesInCny?.[state.selectedVariant];
        if (typeof cnyAmount !== "number" || typeof chinaCnyAmount !== "number") {
          return {
            cnyAmount: cnyAmount ?? null,
            delta: null,
            tone: "neutral",
            label: "暂无人民币换算",
          };
        }

        const delta = cnyAmount - chinaCnyAmount;

        if (Math.abs(delta) < 0.005) {
          return {
            cnyAmount,
            delta,
            tone: "neutral",
            label: "与中国官网基本持平",
          };
        }

        if (delta > 0) {
          return {
            cnyAmount,
            delta,
            tone: "expensive",
            label: `比中国贵 ${formatCnyPrice(delta)}`,
          };
        }

        return {
          cnyAmount,
          delta,
          tone: "cheaper",
          label: `比中国便宜 ${formatCnyPrice(Math.abs(delta))}`,
        };
      }

      function renderRegions() {
        const chinaRegion = state.snapshot.regions.find((region) => region.id === "cn");
        const chinaCnyAmount = chinaRegion?.pricesInCny?.[state.selectedVariant];

        const sortedRegions = state.snapshot.regions
          .filter((region) => region.includeInComparison)
          .sort((left, right) => {
          const leftValue = left?.pricesInCny?.[state.selectedVariant];
          const rightValue = right?.pricesInCny?.[state.selectedVariant];
          const normalizedLeft = typeof leftValue === "number" ? leftValue : -1;
          const normalizedRight = typeof rightValue === "number" ? rightValue : -1;
          return normalizedRight - normalizedLeft;
        });

        const html = sortedRegions
          .map((region) => {
            const price = getRegionPrice(region);
            const comparison = getRegionComparison(region, chinaCnyAmount);
            const status = region.ok
              ? `最近刷新 ${formatTime(region.fetchedAt)}`
              : region.error || "当前不可用";
            const cnyText =
              typeof comparison.cnyAmount === "number"
                ? `约合 ${formatCnyPrice(comparison.cnyAmount)}`
                : "暂无人民币换算";

            return `
              <article class="region-card">
                <div class="region-top">
                  <div class="region-title">
                    <div class="region-name">${region.label}</div>
                  </div>
                  <div class="region-price">${price || "--"}</div>
                </div>
                <div class="region-cny is-${comparison.tone}">${cnyText}</div>
                <div class="delta-pill is-${comparison.tone}">${comparison.label}</div>
                <div class="region-meta">
                  ${state.selectedVariant || "--"} · ${region.currencyCode}
                </div>
                <div class="region-meta">${status}</div>
                <a class="source-link" href="${region.buyUrl}" data-external-link="${region.buyUrl}">
                  打开 ${region.label} 官网
                </a>
              </article>
            `;
          })
          .join("");

        regionList.innerHTML = html;
      }

      async function loadSnapshot({ showRefreshMessage = false } = {}) {
        setLoading(true);
        setStatus(
          showRefreshMessage
            ? "正在重新抓取 Apple 官方购买页价格…"
            : "正在连接 Apple 官方购买页…",
        );

        try {
          state.snapshot = await appClient.fetchSnapshot(state.selectedProductId);
          buildVariantOptions();
          renderSummary();
          renderRegions();

          const availableCount = state.snapshot.regions.filter(
            (region) => region.ok && region.includeInComparison,
          ).length;
          const exchangeMessage = state.snapshot.exchangeRates?.ok
            ? `汇率已更新`
            : `汇率暂不可用`;
          setStatus(
            `已更新 ${availableCount} 个地区的官方价格，默认优先显示中国大陆官网，${exchangeMessage}。`,
          );
        } catch (error) {
          setStatus(
            `价格抓取失败：${error instanceof Error ? error.message : "未知错误"}`,
            "error",
          );
        } finally {
          setLoading(false);
        }
      }

      async function initialize() {
        state.bootstrap = await appClient.getBootstrap();
        state.selectedCategoryId = state.bootstrap.defaultCategoryId;
        state.selectedProductId = state.bootstrap.defaultProductId;
        buildCategoryOptions();
        buildProductOptions();
        await loadSnapshot();
      }

      categorySelect.addEventListener("change", async (event) => {
        state.selectedCategoryId = event.target.value;
        state.selectedProductId = getProductsForSelectedCategory()[0]?.id || null;
        state.selectedVariant = null;
        buildProductOptions();
        await loadSnapshot();
      });

      productSelect.addEventListener("change", async (event) => {
        state.selectedProductId = event.target.value;
        state.selectedVariant = null;
        updateVariantLabel();
        await loadSnapshot();
      });

      variantSelect.addEventListener("change", () => {
        state.selectedVariant = variantSelect.value;
        renderSummary();
        renderRegions();
        setStatus("已切换容量或配置，价格保持为刚刚抓取的官方数据。");
      });

      refreshButton.addEventListener("click", async () => {
        await loadSnapshot({ showRefreshMessage: true });
      });

      regionList.addEventListener("click", async (event) => {
        const link = event.target.closest("[data-external-link]");
        if (!link) {
          return;
        }

        event.preventDefault();
        await appClient.openExternal(link.dataset.externalLink);
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }

      initialize().catch((error) => {
        setLoading(false);
        setStatus(
          `初始化失败：${error instanceof Error ? error.message : "未知错误"}`,
          "error",
        );
      });
    </script>
  </body>
</html>
